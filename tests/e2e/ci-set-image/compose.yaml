# Local end-to-end harness for OIDC CI image promotion. Drive it with the
# scripts in this directory (setup.sh, run.sh, scenarios.sh, teardown.sh):
# they pass --env-file "$E2E_STATE/.env", which holds the generated secrets.
name: gordon-e2e-ci

x-ca: &ca-bundle
  # System roots + the Caddy internal root, generated by setup.sh.
  SSL_CERT_FILE: /e2e-ca/bundle.crt

networks:
  e2e:
    ipam:
      config:
        - subnet: ${E2E_SUBNET:?}

services:
  # Single TLS edge (tls internal). Every public name resolves to it inside
  # the network; the host reaches it on 127.0.0.1:${E2E_EDGE_PORT}.
  edge:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${E2E_EDGE_PORT:-18443}:443"
    environment:
      GORDON_UPSTREAM: ${GORDON_UPSTREAM:-dind:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${E2E_STATE:?run setup.sh}/files:/srv/files:ro
      - caddy-data:/data
    networks:
      e2e:
        ipv4_address: ${E2E_EDGE_IP:?}
        aliases:
          - ermite.localtest.me
          - gordon.localtest.me
          - ci.localtest.me
          - app.localtest.me
          - api.localtest.me
          - files.localtest.me

  ermite:
    build:
      context: ${ERMITE_SRC:?set ERMITE_SRC to an ermite checkout}
    restart: unless-stopped
    environment:
      ERMITE_PUBLIC_URL: https://ermite.localtest.me
      ERMITE_OWNER: e2e
      ERMITE_ADMIN_TOKEN: ${ERMITE_ADMIN_TOKEN:?}
      ERMITE_SECRETS_KEY: ${ERMITE_SECRETS_KEY:?}
      ERMITE_TRUSTED_PROXIES: ${E2E_EDGE_IP:?}/32
      ERMITE_CI_POLL_TIMEOUT: 25s
      ERMITE_LOG_FORMAT: console
    volumes:
      - ermite-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7341/-/health"]
      interval: 2s
      timeout: 2s
      retries: 60
    networks: [e2e]

  # ermite-runner as an unprivileged container, vm isolation (Firecracker).
  # container isolation refuses a rootless Docker daemon.
  runner:
    image: ${RUNNER_IMAGE:-ermite-runner:e2e-final}
    restart: unless-stopped
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      <<: *ca-bundle
      ERMITE_RUNNER_URL: https://ermite.localtest.me
      ERMITE_RUNNER_NAME: e2e-runner
      ERMITE_RUNNER_LABELS: e2e
      ERMITE_RUNNER_REGISTER_TOKEN_FILE: /e2e-runner/register-token
      # Jobs reach ermite.localtest.me:443 through a relay to the edge, so
      # every name the edge serves is reachable from a job (by SNI/Host).
      ERMITE_RUNNER_GUEST_FORGE: "1"
      ERMITE_RUNNER_GUEST_FORGE_TARGET: ${E2E_EDGE_IP:?}:443
      ERMITE_RUNNER_JOB_MEMORY: ${E2E_JOB_MEMORY:-3G}
      ERMITE_RUNNER_JOB_DISK: 24G
      ERMITE_RUNNER_LOG_FORMAT: console
    volumes:
      - ${E2E_STATE:?}/ca:/e2e-ca:ro
      - ${E2E_STATE:?}/runner:/e2e-runner:ro
      - runner-state:/var/lib/ermite-runner
    networks: [e2e]
    depends_on:
      ermite:
        condition: service_healthy

  # Private Docker daemon for Gordon's workloads: nothing touches the host
  # daemon. Gordon shares its network namespace because it dials app
  # backends and its registry on 127.0.0.1.
  dind:
    image: docker:29-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "--host=tcp://127.0.0.1:2375", "--tls=false"]
    volumes:
      - dind-data:/var/lib/docker
    networks: [e2e]

  gordon:
    build:
      context: ../../..
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: service:dind
    command: ["./gordon", "serve", "-c", "/etc/gordon/gordon.toml"]
    environment:
      <<: *ca-bundle
      DOCKER_HOST: tcp://127.0.0.1:2375
      GORDON_AUTH_TOKEN_SECRET: ${GORDON_AUTH_TOKEN_SECRET:?}
    volumes:
      - ${E2E_STATE:?}/gordon.toml:/etc/gordon/gordon.toml:ro
      - ${E2E_STATE:?}/ca:/e2e-ca:ro
      - gordon-data:/data
    depends_on: [dind]

  # Operator-side helper on the e2e network (gordon CLI, docker CLI on the
  # host daemon). Run with `compose run --rm tools ...` from the scripts.
  tools:
    image: docker:29-cli
    profiles: [tools]
    entrypoint: []
    working_dir: /work
    environment:
      <<: *ca-bundle
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ${HOST_DOCKER_SOCK:?}:/var/run/docker.sock
      - ${E2E_STATE:?}/ca:/e2e-ca:ro
      - ${E2E_STATE:?}/files/gordon:/usr/local/bin/gordon:ro
      - ${E2E_STATE:?}:/state
      - ./:/e2e:ro
    networks: [e2e]

volumes:
  caddy-data:
  ermite-data:
  runner-state:
  dind-data:
  gordon-data:
