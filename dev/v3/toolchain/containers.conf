# Development VM only. Keep the packaged Podman configuration unchanged.
[containers]
seccomp_profile = "/opt/gordon-v3-toolchain/share/containers/seccomp.json"

[engine]
helper_binaries_dir = ["/opt/gordon-v3-toolchain/bin", "/opt/gordon-v3-toolchain/libexec/podman", "/usr/libexec/podman", "/usr/lib/podman"]
runtime = "crun"

[network]
network_backend = "netavark"
rootless_port_forwarder = "pasta"
