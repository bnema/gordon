version: 2

# Releases are published on ermite. In CI the runner sets GITHUB_API_URL and
# GITHUB_SERVER_URL to an address the job can reach; the public URLs are the
# fallback for a local run.
github_urls:
  api: '{{ or (index .Env "GITHUB_API_URL") "https://git.bnema.dev/-/github/api" }}/'
  upload: '{{ or (index .Env "GITHUB_API_URL") "https://git.bnema.dev/-/github/api" }}/uploads/'
  download: '{{ or (index .Env "GITHUB_SERVER_URL") "https://git.bnema.dev" }}/'

before:
  hooks:

git:
  prerelease_suffix: "-"

release:
  github:
    owner: bnema
    name: gordon
  # Publish after checking it: ermite release edit gordon <tag> --publish
  draft: true
  prerelease: auto

builds:
  - id: "gordon"
    main: ./main.go
    binary: gordon
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.dirty={{.IsGitDirty}}

# Docker builds disabled for v2.0.0 release (will add back with proper buildx setup)
# dockers:
# docker_manifests:

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
