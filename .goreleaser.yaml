version: 2

git:
  prerelease_suffix: "-"
  tag_sort: smartsemver

release:
  draft: true
  prerelease: auto

builds:
  - id: gordon
    main: ./main.go
    binary: gordon
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: gordon
    ids: [gordon]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - gordon.toml.example

dockers_v2:
  - id: gordon
    ids: [gordon]
    dockerfile: Dockerfile
    images:
      - ghcr.io/bnema/gordon
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - gordon.toml.example
    flags:
      - "--target=release"
      # Emit BuildKit SBOM and SLSA provenance attestations with the release image.
      - "--sbom=true"
      - "--provenance=mode=max"
    sbom: true
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.description: "Self-hosted container deployment platform; one binary provides all Gordon roles"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"

sboms:
  - artifacts: archive

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
