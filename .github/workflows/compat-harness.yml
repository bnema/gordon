name: Compatibility Harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat-harness:
    name: Old/new compatibility slices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Run config compatibility slice
        env:
          GORDON_COMPAT_ARTIFACT_DIR: artifacts/compat
        run: make compat-harness-config

      - name: Run CLI compatibility slice
        env:
          GORDON_COMPAT_ARTIFACT_DIR: artifacts/compat
        run: make compat-harness-cli

      - name: Run API compatibility slice
        env:
          GORDON_COMPAT_ARTIFACT_DIR: artifacts/compat
        run: make compat-harness-api

      - name: Preflight Linux TLS and UDP edge traffic ownership
        run: |
          test "$(uname -s)" = Linux
          make compat-harness-traffic

      - name: Run Docker registry and event-sync compatibility gate
        env:
          GORDON_COMPAT_ARTIFACT_DIR: artifacts/compat
        run: make compat-harness-registry

      - name: Run Docker proxy compatibility slices
        env:
          GORDON_COMPAT_ARTIFACT_DIR: artifacts/compat
        run: make compat-harness-proxy

      - name: Run Docker current-security compatibility gates
        env:
          GORDON_COMPAT_ARTIFACT_DIR: artifacts/compat
        run: make compat-harness-security

      - name: Run rootless Podman migration availability gate
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap
          GORDON_COMPAT_PODMAN=1 make compat-harness-migration

      - name: Run full test suite with real scenarios gated off
        env:
          GORDON_COMPAT_RUN_REAL: "0"
        run: make test

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-harness-reports
          path: artifacts/compat
          if-no-files-found: warn
