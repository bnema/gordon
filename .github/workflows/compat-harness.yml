name: Compatibility Harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat-harness:
    name: Old/new compatibility slices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Docker preflight
        run: docker info

      - name: Run config compatibility slice
        env:
          GORDON_COMPAT_ARTIFACT_DIR: artifacts/compat
        run: make compat-harness-config

      - name: Run CLI compatibility slice
        env:
          GORDON_COMPAT_ARTIFACT_DIR: artifacts/compat
        run: make compat-harness-cli

      - name: Run API compatibility slice
        env:
          GORDON_COMPAT_ARTIFACT_DIR: artifacts/compat
        run: make compat-harness-api

      - name: Run compatibility package tests
        env:
          GORDON_COMPAT_ARTIFACT_DIR: artifacts/compat
        run: go test ./internal/testutils/compatoldnew -count=1

      - name: Run full test suite
        run: make test

      - name: Upload compatibility reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-harness-reports
          path: artifacts/compat
          if-no-files-found: warn
